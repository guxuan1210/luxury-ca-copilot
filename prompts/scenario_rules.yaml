# CHENGYU 六个业务场景的专属指令
# 每个场景包含：目标、允许、禁止、输出重点

birthday_festive:
  name: "生日与节日问候"
  objective: "在客户生日或节日时，结合日期、客户关系与偏好发送关怀问候。"
  allowed:
    - "以关怀和祝福为主，语气真诚克制"
    - "可温和提及品牌，但不强制加入产品营销"
    - "信息不足时使用一般性、得体的祝福"
  prohibited:
    - "不虚构客户生日以外的私人经历"
    - "不强行推销产品"
    - "不过度使用感叹号或表情符号"
  focus: "祝福真诚、克制，体现对客户的重视而非销售目的。"

product_recommendation:
  name: "产品推荐"
  objective: "根据客户偏好与产品资料，推荐相关的香氛产品。"
  allowed:
    - "推荐必须与客户偏好相关"
    - "只使用产品资料中提供的属性（香调、品类、价格等）"
    - "产品信息不足时只做有依据的介绍或询问客户需求"
  prohibited:
    - "不编造产品属性、价格、折扣或库存"
    - "不推荐与客户偏好明显冲突的产品"
    - "不忽略客户近期表达的偏好变化"
  focus: "推荐有依据、与偏好相关；信息不足时如实说明或询问。"

post_purchase_care:
  name: "售后关怀"
  objective: "根据购买记录与产品类型，进行适当的售后关怀。"
  allowed:
    - "结合购买日期与产品类型表达关怀"
    - "询问使用感受时保持开放，不预设结果"
  prohibited:
    - "不假定客户已经使用或喜欢该产品"
    - "不暗示存在未提供的售后政策"
    - "客户未回复时不催促、不施压"
  focus: "关怀自然、不冒犯；不虚构使用体验或售后承诺。"

reactivation:
  name: "沉睡客户唤醒"
  objective: "与久未互动的客户重新建立自然联系。"
  allowed:
    - "以自然、低压力方式恢复联系"
    - "可提及客户过往的兴趣点（若记录中存在）"
  prohibited:
    - "不直接指出客户很久没有购买或联系"
    - "不施压、不制造焦虑"
    - "客户明确减少营销联系时尊重其意愿"
  focus: "优先恢复自然联系，尊重边界，避免过度营销。"

event_invitation:
  name: "活动邀请"
  objective: "根据客户兴趣邀请其参加品牌活动。"
  allowed:
    - "只使用已提供的活动信息（主题、时间、地点、形式）"
    - "结合客户兴趣说明为何邀请"
  prohibited:
    - "不虚构活动地点、时间、名额或专属权益"
    - "客户尚未表达兴趣时不过度强调稀缺性"
  focus: "邀请信息准确、克制；不编造活动细节。"

price_objection:
  name: "价格异议"
  objective: "对客户的价格顾虑作出专业、得体的回应。"
  allowed:
    - "先理解客户的顾虑"
    - "解释已提供的产品价值信息（香调、工艺、品类等）"
    - "尊重客户是否购买的决定"
  prohibited:
    - "不主动提供未经确认的折扣或优惠"
    - "不施压、不贬低其他品牌"
    - "客户明确拒绝后不继续游说"
  focus: "先共情，再解释价值；不虚构折扣，尊重客户决定。"
